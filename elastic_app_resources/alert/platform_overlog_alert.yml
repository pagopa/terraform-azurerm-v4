name: platform-overlog-alert
schedule: "${overlog.frequency_hours}h"
window:
  size: ${overlog.max_lookback_hours_skip_on_sunday}
  unit: h
esql_query:
  query: |
    FROM ${data_view}
    // 1) Filtro pushdown su Lucene: al massimo 4 ore di dati invece dell'intero indice
    | WHERE @timestamp >= NOW() - ${overlog.window_size_hours} hour
     OR (@timestamp >= NOW() - ${overlog.max_lookback_hours} hours AND @timestamp < NOW() - ${overlog.min_lookback_hours} hours)
     OR (@timestamp >= NOW() - ${overlog.max_lookback_hours_skip_on_saturday} hours AND @timestamp < NOW() - ${overlog.min_lookback_hours_skip_on_saturday} hours)
     OR (@timestamp >= NOW() - ${overlog.max_lookback_hours_skip_on_sunday} hours AND @timestamp < NOW() - ${overlog.min_lookback_hours_skip_on_sunday} hours)
    | KEEP @timestamp
    // 2) Un solo riferimento per il giorno, così la finestra precedente resta coerente
    | EVAL prev_end = CASE(
        DAY_NAME(NOW() - ${overlog.min_lookback_hours} hours) == "Saturday", NOW() - ${overlog.min_lookback_hours_skip_on_saturday} hours,
        DAY_NAME(NOW() - ${overlog.min_lookback_hours} hours) == "Sunday",   NOW() - ${overlog.min_lookback_hours_skip_on_sunday} hours,
        NOW() - ${overlog.min_lookback_hours} hours
      )
    | EVAL prev_start = prev_end - 1 hour
    // 3) Conteggi condizionali senza colonne flag intermedie
    | STATS now_count  = COUNT(*) WHERE @timestamp >= NOW() - 1 hour,
            prev_count = COUNT(*) WHERE @timestamp >= prev_start AND @timestamp < prev_end
    | WHERE now_count > ${overlog.min_count_threshold}
    | EVAL percent_change = CASE(
        prev_count > 0, (now_count - prev_count) * 100.0 / prev_count,
        now_count > 0, 100.0,
        0.0
      )
    | WHERE percent_change >= ${overlog.threshold_percentage}
  exclude_hits_from_previous_run: false
  group_by: all
trigger_after_consecutive_runs: 1
enabled: true
notification_channels:
  %{ if can(notification_channels.email.recipient_list_name) }
  email:
    recipient_list_name: ${notification_channels.email.recipient_list_name}
  %{ endif }
  %{ if can(notification_channels.slack.connector_name) }
  slack:
    connector_name: ${notification_channels.slack.connector_name}
  %{ endif }
  %{ if can(notification_channels.jsm.connector_name) }
  jsm:
    connector_name: ${notification_channels.jsm.connector_name}
    prioerity: ${notification_channels.jsm.priority}
  %{ endif }
investigation:
  message: |
    The alert has been triggered because the number of log entries in the last ${overlog.window_size_hours} hours has increased by ${overlog.threshold_percentage}% or more compared to the previous ${overlog.max_lookback_hours} hours.
    Check the linked dashboard to identify the overlogging service, then evaluate if it can be detached from the log collection configuration on elasticcloud-infra
  dashboards:
    - logs-by-service
